services:
  party-hq:
    build: .
    image: party-hq:latest
    container_name: party-hq
    restart: unless-stopped
    env_file: .env
    # Only reachable from the server itself; nginx or Apache in front handles HTTPS.
    ports:
      - "127.0.0.1:${PARTY_PORT:-8080}:8000"
    volumes:
      - party-data:/data

volumes:
  party-data:
