# WM behind Apache (needs Apache 2.4.47+ for upgrade=websocket; Ubuntu 22.04+ is fine).
#   sudo a2enmod proxy proxy_http proxy_wstunnel headers
# Pick ONE option, edit the hostname, then:
#   sudo cp apache.conf /etc/apache2/sites-available/wm.conf
#   sudo a2ensite wm && sudo apachectl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d party.example.org     # adds HTTPS

# --- Option A: its own hostname -------------------------------------------
<VirtualHost *:80>
    ServerName party.example.org
    ProxyPreserveHost On
    ProxyTimeout 3600
    ProxyPass        / http://127.0.0.1:8080/ upgrade=websocket
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>

# --- Option B: a sub-path on an existing site, e.g. https://your-host/party/
# Put these lines inside your existing <VirtualHost> instead of Option A:
#
#    RedirectMatch 301 ^/party$ /party/
#    ProxyPass        /party/ http://127.0.0.1:8080/ upgrade=websocket
#    ProxyPassReverse /party/ http://127.0.0.1:8080/
