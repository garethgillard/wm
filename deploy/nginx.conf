# Party HQ behind nginx.
# Pick ONE of the two options below, edit the hostname, then:
#   sudo cp nginx.conf /etc/nginx/sites-available/party-hq
#   sudo ln -s /etc/nginx/sites-available/party-hq /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d party.example.org      # adds HTTPS

# --- Option A: its own hostname, e.g. https://party.example.org/ -------------
server {
    listen 80;
    listen [::]:80;
    server_name party.example.org;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep the live chat connection open
    }
}

